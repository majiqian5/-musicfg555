name: Build musicfg

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Theos
        run: |
          brew install ldid xz
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
        env:
          THEOS: ${{ github.workspace }}/theos
      
      - name: Download iOS SDK
        run: |
          mkdir -p sdks-tmp && cd sdks-tmp
          git init
          git remote add origin https://github.com/theos/sdks.git
          git config core.sparseCheckout true
          echo "iPhoneOS14.5.sdk" >> .git/info/sparse-checkout
          git pull --depth 1 origin master
          mkdir -p $THEOS/sdks
          cp -r iPhoneOS14.5.sdk $THEOS/sdks/
          cd $THEOS/sdks
          ln -s iPhoneOS14.5.sdk iPhoneOS15.0.sdk 2>/dev/null || true
          ln -s iPhoneOS14.5.sdk iPhoneOS15.5.sdk 2>/dev/null || true
          ln -s iPhoneOS14.5.sdk iPhoneOS16.0.sdk 2>/dev/null || true
          ln -s iPhoneOS14.5.sdk iPhoneOS16.5.sdk 2>/dev/null || true
        env:
          THEOS: ${{ github.workspace }}/theos
      
      - name: Clean up files
        run: |
          find . -name ".gitkeep" -delete
      
      - name: Build Package
        run: |
          export THEOS=${{ github.workspace }}/theos
          make package FINALPACKAGE=1
      
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: musicfg-deb
          path: packages/*.deb
