name: Build musicfg

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Theos
        run: |
          brew install ldid xz
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
        env:
          THEOS: ${{ github.workspace }}/theos
      
      - name: Download iOS SDK
        run: |
          curl -fL -o sdk.tar.xz "https://github.com/xybp888/iOS-SDKs/releases/download/iOS14.5/iPhoneOS14.5.sdk.tar.xz"
          tar -xf sdk.tar.xz
          mkdir -p $THEOS/sdks
          mv iPhoneOS14.5.sdk $THEOS/sdks/
        env:
          THEOS: ${{ github.workspace }}/theos
      
      - name: Build Package
        run: |
          export THEOS=${{ github.workspace }}/theos
          export SDKVERSION=14.5
          make package FINALPACKAGE=1
      
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: musicfg-deb
          path: packages/*.deb
