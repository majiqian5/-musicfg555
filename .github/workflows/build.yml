name: Build musicfg

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Theos
        run: |
          brew install ldid xz
          git clone --recursive https://github.com/theos/theos.git $THEOS
        env:
          THEOS: ${{ github.workspace }}/theos
      
      - name: Download iOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git
          cp -r sdks/iPhoneOS16.5.sdk $THEOS/sdks/ 2>/dev/null || \
          cp -r sdks/iPhoneOS15.5.sdk $THEOS/sdks/ 2>/dev/null || \
          cp -r sdks/iPhoneOS*.sdk $THEOS/sdks/
        env:
          THEOS: ${{ github.workspace }}/theos
      
      - name: Build Package
        run: |
          export THEOS=${{ github.workspace }}/theos
          make package FINALPACKAGE=1
      
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: musicfg-deb
          path: packages/*.deb
