name: Build musicfg

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Theos
        run: |
          brew install ldid xz
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
        env:
          THEOS: ${{ github.workspace }}/theos
      
      - name: Download iOS SDK
        run: |
          mkdir -p sdks-tmp && cd sdks-tmp
          git init
          git remote add origin https://github.com/theos/sdks.git
          git config core.sparseCheckout true
          echo "iPhoneOS14.5.sdk" >> .git/info/sparse-checkout
          git pull --depth 1 origin master
          cp -r iPhoneOS14.5.sdk $THEOS/sdks/
        env:
          THEOS: ${{ github.workspace }}/theos
      
      - name: Build Package
        run: |
          export THEOS=${{ github.workspace }}/theos
          export SDKVERSION=14.5
          make package FINALPACKAGE=1
      
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: musicfg-deb
          path: packages/*.deb
